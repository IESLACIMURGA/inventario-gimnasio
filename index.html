<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Política de seguridad: solo se ejecuta código de esta web y solo se descargan
       datos de la propia web o de Google Sheets. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' https: data: blob:; connect-src 'self' https://docs.google.com https://*.googleusercontent.com; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="description" content="Inventario del almacén del gimnasio: material, cantidades, tallas y ubicaciones.">
  <meta name="theme-color" content="#36434d">
  <title>Almacén del gimnasio</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="img/icono-192.png" type="image/png">
  <link rel="apple-touch-icon" href="img/icono-192.png">
  <link rel="stylesheet" href="css/estilos.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <a class="saltar" href="#contenido">Saltar al contenido</a>

  <aside class="lateral" id="lateral" aria-label="Navegación">
    <a class="marca" href="#/inventario">
      <img id="logo-img" class="marca-logo" alt="">
      <span class="marca-texto">
        <span class="marca-centro" data-centro>IES Lacimurga</span>
        <span class="marca-sub" data-subtitulo>Constantia Iulia</span>
      </span>
    </a>
    <div class="lateral-scroll">
      <h2 class="lateral-titulo">Categorías</h2>
      <ul class="categorias" id="lista-categorias"></ul>
      <h2 class="lateral-titulo">Almacén</h2>
      <ul class="nav-secundaria">
        <li><a href="#/ubicaciones"><span class="cat-icono" aria-hidden="true">📍</span>Ubicaciones</a></li>
        <li><a href="#/etiquetas"><span class="cat-icono" aria-hidden="true">▦</span>Etiquetas QR</a></li>
      </ul>
    </div>
    <div class="lateral-pie">
      <span id="info-datos" class="info-datos"></span>
      <button type="button" id="boton-actualizar" class="boton-actualizar">↻ Actualizar datos</button>
    </div>
  </aside>
  <div class="velo" id="velo"></div>

  <div class="principal">
    <header class="barra-superior">
      <button type="button" id="boton-menu" class="boton-menu" aria-label="Abrir menú" aria-controls="lateral">☰</button>
      <form class="busqueda" id="form-busqueda" role="search">
        <label for="buscador" class="solo-lector">Buscar material</label>
        <svg class="lupa" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="m20 20-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input type="search" id="buscador" placeholder="Buscar material, talla, ubicación o código…" autocomplete="off" enterkeyhint="search">
      </form>
      <button type="button" id="boton-exportar" class="boton-exportar" title="Descargar lo que estás viendo en formato Excel (CSV)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 7v9m-4-4 4 4 4-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Exportar</span>
      </button>
    </header>
    <main id="contenido" class="contenido" tabindex="-1"></main>
    <footer class="pie sin-imprimir"><span data-titulo>Almacén del gimnasio</span> · <span data-centro>IES Lacimurga</span></footer>
  </div>
  <noscript><p class="aviso aviso-error">Esta web necesita JavaScript activado para mostrar el inventario.</p></noscript>
</body>
</html>
